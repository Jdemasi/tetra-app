<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetra Mechanical Services — Job Cost System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
:root{--navy:#1B2A5E;--red:#B22234;--white:#fff;--gray50:#F8F9FA;--gray100:#F1F3F5;--gray200:#E9ECEF;--gray400:#ADB5BD;--gray600:#6C757D;--gray800:#343A40;--green:#1D9E75;--amber:#EF9F27;--danger:#E24B4A;--border:#E9ECEF}
body{background:#F1F3F5;color:#343A40}
.app{display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sb{width:220px;min-width:220px;background:var(--navy);display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:16px;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;gap:10px;flex-shrink:0}
.sb-mark{width:34px;height:34px;background:var(--red);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.sb-co{color:#fff;font-size:12px;font-weight:600;line-height:1.3}
.sb-sub{color:rgba(255,255,255,0.45);font-size:10px}
.sb-sec{padding:8px 0}
.sb-lbl{font-size:10px;font-weight:600;color:rgba(255,255,255,0.3);padding:8px 16px 3px;letter-spacing:.07em;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:12px;color:rgba(255,255,255,0.6);cursor:pointer;transition:all .12s;border:none;background:none;width:100%;text-align:left}
.sb-item:hover{background:rgba(255,255,255,0.08);color:#fff}
.sb-item.active{background:var(--red);color:#fff}
.sb-item svg{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb-job{padding:4px 16px 4px 12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.sb-job:hover .sj-name{color:#fff}
.sj-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sj-name{font-size:11px;color:rgba(255,255,255,0.5);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:.12s}
.sj-num{font-size:10px;color:rgba(255,255,255,0.25)}
.sb-job.active-job .sj-name{color:#fff;font-weight:600}
.sb-mod{display:flex;align-items:center;gap:7px;padding:5px 16px 5px 28px;font-size:11px;color:rgba(255,255,255,0.45);cursor:pointer;transition:.12s;border:none;background:none;width:100%;text-align:left}
.sb-mod:hover{color:#fff}
.sb-mod.active{color:#fff;font-weight:600}
.sb-mod svg{width:13px;height:13px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:50px;flex-shrink:0}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--gray600)}
.breadcrumb .cur{color:var(--gray800);font-weight:600}
.breadcrumb .sep{color:var(--gray400)}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn{padding:6px 14px;font-size:12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--gray800);cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.12s;font-weight:500}
.btn:hover{background:var(--gray100)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn-primary:hover{background:#16235a}
.btn-red{background:var(--red);color:#fff;border-color:var(--red)}
.btn-red:hover{background:#9e1e2e}
.btn-sm{padding:4px 10px;font-size:11px}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:20px}

/* CARDS */
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:600;color:var(--gray800);display:flex;align-items:center;gap:7px}
.card-title svg{width:15px;height:15px;stroke:var(--navy);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* KPI GRID */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kcard{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;border-top:3px solid var(--navy)}
.kcard.red{border-top-color:var(--red)}
.kcard.grn{border-top-color:var(--green)}
.kcard.amb{border-top-color:var(--amber)}
.klbl{font-size:11px;color:var(--gray600);margin-bottom:5px;font-weight:500}
.kval{font-size:20px;font-weight:600;color:var(--gray800)}
.ksub{font-size:10px;margin-top:3px;color:var(--gray600)}
.ksub.g{color:var(--green)}.ksub.r{color:var(--danger)}.ksub.a{color:var(--amber)}

/* TABLE */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;font-size:10px;font-weight:600;color:var(--gray600);padding:7px 10px;border-bottom:1px solid var(--border);background:var(--gray50);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--gray800);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--gray50)}
.tbl-empty{text-align:center;color:var(--gray400);padding:32px;font-size:13px}

/* BADGES */
.badge{display:inline-flex;align-items:center;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
.b-paid{background:#E1F5EE;color:#085041}
.b-pending{background:#E6F1FB;color:#0C447C}
.b-overdue{background:#FCEBEB;color:#791F1F}
.b-partial{background:#FFF3CD;color:#633806}
.b-active{background:#E1F5EE;color:#085041}
.b-complete{background:#E6F1FB;color:#0C447C}
.b-hold{background:#FFF3CD;color:#633806}
.b-notstarted{background:var(--gray100);color:var(--gray600)}

/* FORM */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.fgroup{display:flex;flex-direction:column;gap:4px}
.flbl{font-size:10px;font-weight:600;color:var(--gray600);text-transform:uppercase;letter-spacing:.04em}
.finp{padding:7px 10px;font-size:12px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--gray800);outline:none;transition:.12s;width:100%}
.finp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,42,94,0.08)}
select.finp{cursor:pointer}
.form-actions{display:flex;gap:8px;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--border);margin-top:4px}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:12px;padding:20px;width:90%;max-width:560px;max-height:90vh;overflow-y:auto}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
.modal-title{font-size:15px;font-weight:600;color:var(--gray800)}
.modal-close{background:none;border:none;cursor:pointer;color:var(--gray400);font-size:20px;line-height:1;padding:2px}
.modal-close:hover{color:var(--gray800)}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--gray400);font-size:13px;gap:8px}
.spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--gray800);color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:500;z-index:200;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.success{background:var(--green)}
.toast.error{background:var(--danger)}

/* PAGE VIEWS */
.view{display:none}.view.active{display:block}

/* GRID 2 */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.g2{grid-template-columns:1fr}}

/* ROW */
.row-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.row-item:last-child{border-bottom:none}
.ri-info{flex:1;min-width:0}
.ri-name{font-size:12px;font-weight:600;color:var(--gray800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-sub{font-size:10px;color:var(--gray600)}
.ri-right{text-align:right;flex-shrink:0}
.ri-val{font-size:13px;font-weight:600;color:var(--gray800)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dg{background:var(--green)}.da{background:var(--amber)}.dr{background:var(--danger)}.db{background:var(--navy)}
.pbar-wrap{height:4px;background:var(--gray200);border-radius:2px;margin-top:4px;width:70px}
.pbar{height:4px;border-radius:2px}
.pg{background:var(--green)}.pa{background:var(--amber)}.pr{background:var(--danger)}
.mono{font-family:monospace;font-size:11px}
.text-right{text-align:right}
.text-green{color:var(--green)}.text-red{color:var(--danger)}.text-amber{color:var(--amber)}
.font-600{font-weight:600}
.section-sub{font-size:11px;color:var(--gray600);margin-bottom:12px}
</style>
</head>
<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sb">
  <div class="sb-logo">
    <div class="sb-mark">T</div>
    <div><div class="sb-co">Tetra Mechanical</div><div class="sb-sub">Services</div></div>
  </div>
  <div class="sb-sec">
    <div class="sb-lbl">Company</div>
    <button class="sb-item active" data-view="dashboard">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard
    </button>
    <button class="sb-item" data-view="wip">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>WIP Schedule
    </button>
    <button class="sb-item" data-view="ar-aging">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>AR Aging
    </button>
  </div>
  <div class="sb-sec">
    <div class="sb-lbl">Projects</div>
    <div id="sb-projects"></div>
    <button class="sb-item" id="btn-new-project">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New Project
    </button>
  </div>
  <div class="sb-sec" style="margin-top:auto">
    <div class="sb-lbl">System</div>
    <button class="sb-item" data-view="employees">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Employees
    </button>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb"><span class="cur">Company Dashboard</span></div>
    <div class="topbar-right" id="topbar-actions"></div>
  </div>
  <div class="content" id="content">
    <div class="loading"><div class="spinner"></div>Loading...</div>
  </div>
</div>

</div>

<!-- MODALS -->
<div class="modal-bg" id="modal-project">
  <div class="modal">
    <div class="modal-hd"><div class="modal-title" id="modal-project-title">New Project</div><button class="modal-close" onclick="closeModal('modal-project')">×</button></div>
    <div class="form-grid">
      <div class="fgroup"><label class="flbl">Job Number</label><input class="finp" id="p-num" placeholder="e.g. 2601"></div>
      <div class="fgroup"><label class="flbl">Job Name</label><input class="finp" id="p-name" placeholder="e.g. Edenwald"></div>
      <div class="fgroup"><label class="flbl">Client</label><input class="finp" id="p-client" placeholder="e.g. PEG"></div>
      <div class="fgroup"><label class="flbl">Status</label><select class="finp" id="p-status"><option>Active</option><option>Complete</option><option>On Hold</option><option>Bidding</option></select></div>
      <div class="fgroup"><label class="flbl">Date Started</label><input class="finp" type="date" id="p-date"></div>
      <div class="fgroup"><label class="flbl">Base Contract ($)</label><input class="finp" type="number" id="p-contract" placeholder="0"></div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeModal('modal-project')">Cancel</button>
      <button class="btn btn-red" onclick="saveProject()">Save Project</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-phase">
  <div class="modal">
    <div class="modal-hd"><div class="modal-title">Add Phase</div><button class="modal-close" onclick="closeModal('modal-phase')">×</button></div>
    <div class="form-grid">
      <div class="fgroup" style="grid-column:1/-1"><label class="flbl">Phase Name</label><input class="finp" id="ph-name" placeholder="e.g. Building 7"></div>
      <div class="fgroup"><label class="flbl">Status</label><select class="finp" id="ph-status"><option>Not Started</option><option>In Progress</option><option>Complete</option><option>On Hold</option></select></div>
      <div class="fgroup"><label class="flbl">Phase Budget ($)</label><input class="finp" type="number" id="ph-budget" placeholder="0"></div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeModal('modal-phase')">Cancel</button>
      <button class="btn btn-red" onclick="savePhase()">Save Phase</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-purchase">
  <div class="modal" style="max-width:640px">
    <div class="modal-hd"><div class="modal-title">Log Invoice / Purchase</div><button class="modal-close" onclick="closeModal('modal-purchase')">×</button></div>
    <div class="form-grid">
      <div class="fgroup"><label class="flbl">Vendor</label><input class="finp" id="pu-vendor" placeholder="e.g. Ferguson"></div>
      <div class="fgroup"><label class="flbl">Invoice #</label><input class="finp" id="pu-inv" placeholder="e.g. INV-1234"></div>
      <div class="fgroup"><label class="flbl">Invoice Date</label><input class="finp" type="date" id="pu-date"></div>
      <div class="fgroup"><label class="flbl">PO Number</label><input class="finp" id="pu-po" placeholder="Optional"></div>
      <div class="fgroup"><label class="flbl">Category</label><select class="finp" id="pu-cat"><option value="">Select...</option><option>Materials</option><option>Labor</option><option>Subcontractors</option><option>Equipment</option><option>Rentals</option><option>Misc.</option></select></div>
      <div class="fgroup"><label class="flbl">Phase</label><select class="finp" id="pu-phase"><option value="">Select phase...</option></select></div>
      <div class="fgroup"><label class="flbl">PO Amount ($)</label><input class="finp" type="number" id="pu-amount" placeholder="0.00"></div>
      <div class="fgroup"><label class="flbl">Paid Amount ($)</label><input class="finp" type="number" id="pu-paid" placeholder="0.00"></div>
      <div class="fgroup"><label class="flbl">Terms (Days)</label><input class="finp" type="number" id="pu-terms" value="30"></div>
      <div class="fgroup"><label class="flbl">Status</label><select class="finp" id="pu-status"><option>Pending</option><option>Paid</option><option>Partial</option><option>Overdue</option></select></div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeModal('modal-purchase')">Cancel</button>
      <button class="btn btn-red" onclick="savePurchase()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-labor">
  <div class="modal" style="max-width:640px">
    <div class="modal-hd"><div class="modal-title">Log Hours</div><button class="modal-close" onclick="closeModal('modal-labor')">×</button></div>
    <div class="form-grid">
      <div class="fgroup"><label class="flbl">Employee</label><select class="finp" id="la-emp"><option value="">Select...</option></select></div>
      <div class="fgroup"><label class="flbl">Phase</label><select class="finp" id="la-phase"><option value="">Select phase...</option></select></div>
      <div class="fgroup"><label class="flbl">Week Ending</label><input class="finp" type="date" id="la-week"></div>
      <div class="fgroup"><label class="flbl">ST Hours</label><input class="finp" type="number" id="la-st" placeholder="0.00" step="0.25"></div>
      <div class="fgroup"><label class="flbl">OT 1.5x Hours</label><input class="finp" type="number" id="la-ot15" placeholder="0.00" step="0.25"></div>
      <div class="fgroup"><label class="flbl">OT 2x Hours</label><input class="finp" type="number" id="la-ot2" placeholder="0.00" step="0.25"></div>
    </div>
    <div id="la-cost-preview" style="background:var(--gray50);border-radius:8px;padding:10px;margin-bottom:12px;font-size:12px;color:var(--gray600)">Select employee to see cost preview</div>
    <div class="form-actions">
      <button class="btn" onclick="closeModal('modal-labor')">Cancel</button>
      <button class="btn btn-red" onclick="saveLabor()">Save Hours</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-invoice">
  <div class="modal" style="max-width:600px">
    <div class="modal-hd"><div class="modal-title">New Invoice to Client</div><button class="modal-close" onclick="closeModal('modal-invoice')">×</button></div>
    <div class="form-grid">
      <div class="fgroup"><label class="flbl">Invoice #</label><input class="finp" id="inv-num" placeholder="e.g. INV-2601-07"></div>
      <div class="fgroup"><label class="flbl">Invoice Date</label><input class="finp" type="date" id="inv-date"></div>
      <div class="fgroup" style="grid-column:1/-1"><label class="flbl">Description</label><input class="finp" id="inv-desc" placeholder="e.g. Application #7 — Buildings 14 & 15"></div>
      <div class="fgroup"><label class="flbl">Billed Amount ($)</label><input class="finp" type="number" id="inv-billed" placeholder="0.00" oninput="calcInvPreview()"></div>
      <div class="fgroup"><label class="flbl">Retainage %</label><input class="finp" type="number" id="inv-ret-pct" value="10" oninput="calcInvPreview()"></div>
      <div class="fgroup"><label class="flbl">Retainage Held ($)</label><input class="finp" id="inv-ret-held" readonly style="background:var(--gray50)"></div>
      <div class="fgroup"><label class="flbl">Net Due ($)</label><input class="finp" id="inv-net" readonly style="background:var(--gray50)"></div>
      <div class="fgroup"><label class="flbl">Paid Amount ($)</label><input class="finp" type="number" id="inv-paid" placeholder="0.00"></div>
      <div class="fgroup"><label class="flbl">Terms (Days)</label><input class="finp" type="number" id="inv-terms" value="30"></div>
      <div class="fgroup"><label class="flbl">Status</label><select class="finp" id="inv-status"><option>Pending</option><option>Paid</option><option>Partial</option><option>Overdue</option></select></div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeModal('modal-invoice')">Cancel</button>
      <button class="btn btn-red" onclick="saveInvoice()">Save Invoice</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-employee">
  <div class="modal">
    <div class="modal-hd"><div class="modal-title">Add Employee</div><button class="modal-close" onclick="closeModal('modal-employee')">×</button></div>
    <div class="form-grid">
      <div class="fgroup"><label class="flbl">Full Name</label><input class="finp" id="em-name" placeholder="e.g. Craig Ryder"></div>
      <div class="fgroup"><label class="flbl">Role</label><input class="finp" id="em-role" placeholder="e.g. Journeyman"></div>
      <div class="fgroup"><label class="flbl">ST Rate ($/hr all-in)</label><input class="finp" type="number" id="em-rate" placeholder="0.00"></div>
      <div class="fgroup"><label class="flbl">Effective Date</label><input class="finp" type="date" id="em-date"></div>
    </div>
    <div class="form-actions">
      <button class="btn" onclick="closeModal('modal-employee')">Cancel</button>
      <button class="btn btn-red" onclick="saveEmployee()">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-co">
  <div class="modal" style="max-width:600px">
    <div class="modal-hd"><div class="modal-title">Log Change Order</div><button class="modal-close" onclick="closeModal('modal-co')">×</button></div>
    <div class="form-grid">
      <div class="fgroup"><label class="flbl">CO Number</label><input class="finp" id="co-num" placeholder="e.g. CO-001"></div>
      <div class="fgroup"><label class="flbl">Date Submitted</label><input class="finp" type="date" id="co-date"></div>
      <div class="fgroup" style="grid-column:1/-1"><label class="flbl">Description</label><input class="finp" id="co-desc" placeholder="What does this change order cover?"></div>
      <div class="fgroup"><label class="flbl">Amount ($)</label><input class="finp" type="number" id="co-amount" placeholder="0.00"></div>
      <div class="fgroup"><label class="flbl">Type</label><select class="finp" id="co-type"><option value="">Select...</option><option>Labor</option><option>Material</option><option>Subcontractor</option><option>Equipment</option><option>Other</option></select></div>

}

// ── NAVIGATION ──────────────────────────────────────────────────────

function navigate(view, projectId=null, module=null) {
  state.view = view;
  state.activeProject = projectId ? state.projects.find(p=>p.id===projectId) : state.activeProject;

}

    else if (state.activeModule === 'labor') await renderLabor();

  }
}

async function saveBudget(projectId, category, amount) {
  const { error } = await db.from('project_budgets').upsert({ project_id: projectId, category, budgeted_amount: parseFloat(amount)||0 }, { onConflict: 'project_id,category' });
  if (!error) toast('Budget saved');
}

function openAddPhase(projectId) {
  clearForm(['ph-name','ph-budget']);
  $('ph-status').value = 'Not Started';
  openModal('modal-phase');
  $('modal-phase').dataset.projectId = projectId;
}

async function savePhase() {
  const projectId = $('modal-phase').dataset.projectId;
  const name = $('ph-name').value.trim();
  if (!name) { toast('Enter a phase name','error'); return; }
  const { error } = await db.from('phases').insert({ project_id: projectId, phase_name: name, status: $('ph-status').value, phase_budget: parseFloat($('ph-budget').value)||0, sort_order: state.phases.length });
  if (error) { toast('Error: '+error.message,'error'); return; }
  closeModal('modal-phase');
  toast('Phase added');
  render();
}

function openNewLabor(projectId) {
  $('la-week').value = today();
  clearForm(['la-st','la-ot15','la-ot2']);
  const empSel = $('la-emp');
  empSel.innerHTML = '<option value="">Select employee...</option>' + state.employees.map(e=>`<option value="${e.id}" data-rate="${e.st_rate}" data-name="${e.name}" data-role="${e.role||''}">${e.name} — ${e.role||''}</option>`).join('');

  phSel.innerHTML = '<option value="">Select phase...</option>' + state.phases.map(ph=>`<option value="${ph.id}">${ph.phase_name}</option>`).join('');

function updateLaborPreview() {
  const sel = $('la-emp');
  const opt = sel.options[sel.selectedIndex];
  if (!opt || !opt.dataset.rate) { $('la-cost-preview').textContent = 'Select employee to see cost preview'; return; }
  const rate = parseFloat(opt.dataset.rate)||0;
  const st = parseFloat($('la-st').value)||0;
  const ot15 = parseFloat($('la-ot15').value)||0;
  const ot2 = parseFloat($('la-ot2').value)||0;
  const stCost = st*rate, ot15Cost = ot15*rate*1.5, ot2Cost = ot2*rate*2;
  const total = stCost+ot15Cost+ot2Cost;
  $('la-cost-preview').innerHTML = `<strong>${opt.dataset.name}</strong> @ ${fmtD(rate)}/hr &nbsp;|&nbsp; ST: ${fmt(stCost)} &nbsp;|&nbsp; OT 1.5x: ${fmt(ot15Cost)} &nbsp;|&nbsp; OT 2x: ${fmt(ot2Cost)} &nbsp;|&nbsp; <strong>Total: ${fmt(total)}</strong>`;
}

        else catCosts[cat] = phPurchases.filter(pu=>pu.category===cat).reduce((s,pu)=>s+parseFloat(pu.po_amount||0),0);

    }).join('')}

  </div>`;
}

// ── BUDGET vs ACTUAL ─────────────────────────────────────────────────
async function renderBVA() {
  const p = state.activeProject;
  const [{ data: budgets }, { data: purchases }, { data: labor }] = await Promise.all([
    db.from('project_budgets').select('*').eq('project_id', p.id),
    db.from('purchases').select('*').eq('project_id', p.id),
    db.from('labor_entries').select('*').eq('project_id', p.id),
  ]);
  const cats = ['Materials','Labor','Subcontractors','Equipment','Rentals','Misc.'];
  const budMap = {};
  (budgets||[]).forEach(b => budMap[b.category]=parseFloat(b.budgeted_amount||0));
  const totalBud = cats.reduce((s,c)=>s+(budMap[c]||0),0);
  const laborCost = l => (parseFloat(l.st_hours||0)*parseFloat(l.st_rate||0))+(parseFloat(l.ot15_hours||0)*parseFloat(l.st_rate||0)*1.5)+(parseFloat(l.ot2_hours||0)*parseFloat(l.st_rate||0)*2);
  const catActuals = {};
  cats.forEach(cat => {
    if (cat==='Labor') catActuals[cat] = (labor||[]).reduce((s,l)=>s+laborCost(l),0);
    else catActuals[cat] = (purchases||[]).filter(pu=>pu.category===cat).reduce((s,pu)=>s+parseFloat(pu.po_amount||0),0);
  });
  const totalAct = cats.reduce((s,c)=>s+catActuals[c],0);
  $('content').innerHTML = `
  <div class="kgrid">
    <div class="kcard db"><div class="klbl">Total Budget</div><div class="kval">${fmt(totalBud)}</div></div>
    <div class="kcard red"><div class="klbl">Cost to Date</div><div class="kval">${fmt(totalAct)}</div></div>
    <div class="kcard ${totalBud-totalAct<0?'red':'grn'}"><div class="klbl">Remaining</div><div class="kval">${fmt(totalBud-totalAct)}</div></div>
    <div class="kcard amb"><div class="klbl">% Used</div><div class="kval">${totalBud>0?Math.round(totalAct/totalBud*100):0}%</div></div>
  </div>
  <div class="card">
    <div class="card-hd"><div class="card-title"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Budget vs Actual by Category</div></div>
    <table><thead><tr><th>Category</th><th class="text-right">Budgeted</th><th class="text-right">Actual Cost</th><th class="text-right">Remaining</th><th>% Used</th></tr></thead><tbody>
    ${cats.map((cat,i) => {
      const bud = budMap[cat]||0;
      const act = catActuals[cat]||0;
      const rem = bud-act;
      const pct = bud>0?act/bud:0;
      const barColor = pct>0.9?'#E24B4A':pct>0.75?'#EF9F27':'#1D9E75';
      return `<tr>
        <td class="font-600">${cat}</td>
        <td class="text-right">${fmt(bud)}</td>
        <td class="text-right">${fmt(act)}</td>
        <td class="text-right ${rem<0?'text-red':'text-green'} font-600">${fmt(rem)}</td>
        <td style="min-width:120px">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="flex:1;height:6px;background:var(--gray200);border-radius:3px">
              <div style="width:${Math.min(100,Math.round(pct*100))}%;height:6px;border-radius:3px;background:${barColor}"></div>
            </div>
            <span style="font-size:11px;font-weight:600;min-width:32px">${Math.round(pct*100)}%</span>
          </div>
        </td>
      </tr>`;
    }).join('')}
    </tbody></table>
    <div style="border-top:1px solid var(--border);margin-top:10px;padding-top:10px;display:flex;justify-content:space-between;font-size:12px;font-weight:600">
      <span>TOTAL</span>
      <span>${fmt(totalBud)}</span>
      <span>${fmt(totalAct)}</span>
      <span class="${totalBud-totalAct<0?'text-red':'text-green'}">${fmt(totalBud-totalAct)}</span>
      <span>${totalBud>0?Math.round(totalAct/totalBud*100):0}%</span>
    </div>
  </div>`;
}

    ${(cos||[]).length === 0 ? '<div class="tbl-empty">No change orders yet. Click "+ New CO" to add one.</div>' :
    `<table><thead><tr><th>CO #</th><th>Description</th><th>Type</th><th class="text-right">Amount</th><th>Submitted</th><th>Approved</th><th>Status</th></tr></thead><tbody>
    ${(cos||[]).map(c=>`<tr>
      <td class="mono font-600">${c.co_number||'—'}</td>
      <td>${c.description||'—'}</td>
      <td>${c.co_type||'—'}</td>
      <td class="text-right font-600 ${parseFloat(c.amount||0)<0?'text-red':'text-green'}">${fmt(c.amount)}</td>
      <td>${c.submitted_date||'—'}</td>
      <td>${c.approved_date||'—'}</td>
      <td><span class="badge b-${(c.status||'pending').toLowerCase().replace('/','').replace(' ','')}
        ${c.status==='Approved'?'b-paid':c.status==='Rejected'?'b-overdue':c.status==='Submitted'?'b-partial':'b-pending'}">${c.status}</span></td>
    </tr>`).join('')}
    </tbody></table>`}
    </div>
  </div>`;
  $('topbar-actions').innerHTML = `<button class="btn btn-sm btn-red" onclick="openNewCO('${p.id}')">+ New CO</button>`;
}

function openNewCO(projectId) {
  clearForm(['co-num','co-desc','co-amount','co-approved']);
  $('co-date').value = today();
  $('co-status').value = 'Pending';
  $('co-type').value = '';
  $('modal-co').dataset.projectId = projectId;
  openModal('modal-co');
}

async function saveCO() {
  const projectId = $('modal-co').dataset.projectId;
  const desc = $('co-desc').value.trim();
  if (!desc) { toast('Enter a description','error'); return; }
  const status = $('co-status').value;
  const { error } = await db.from('change_orders').insert({
    project_id: projectId,
    co_number: $('co-num').value,
    description: desc,
    amount: parseFloat($('co-amount').value)||0,
    co_type: $('co-type').value,
    status,
    submitted_date: $('co-date').value||null,
    approved_date: $('co-approved').value||null,
  });
  if (error) { toast('Error: '+error.message,'error'); return; }
  // If approved, update project approved_cos total
  if (status === 'Approved') {
    const proj = state.projects.find(p=>p.id===projectId);
    if (proj) {
      const newTotal = parseFloat(proj.approved_cos||0) + (parseFloat($('co-amount').value)||0);
      await db.from('projects').update({approved_cos: newTotal}).eq('id', projectId);
    }
  }
  closeModal('modal-co');
  toast('Change order saved');
  render();
}

// ── WIP SCHEDULE ─────────────────────────────────────────────────────
async function renderWIP() {
  const [{ data: projects }, { data: purchases }, { data: labor }, { data: invoices }, { data: budgets }] = await Promise.all([
    db.from('projects').select('*').eq('status','Active'),
    db.from('purchases').select('*'),
    db.from('labor_entries').select('*'),
    db.from('invoices').select('*'),
    db.from('project_budgets').select('*'),
  ]);
  const laborCost = l => (parseFloat(l.st_hours||0)*parseFloat(l.st_rate||0))+(parseFloat(l.ot15_hours||0)*parseFloat(l.st_rate||0)*1.5)+(parseFloat(l.ot2_hours||0)*parseFloat(l.st_rate||0)*2);
  $('content').innerHTML = `
  <div class="card">
    <div class="card-hd"><div class="card-title"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>WIP Schedule — Active Jobs</div></div>
    <p class="section-sub">Work in Progress report showing over/under billing position for each active job.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Job</th><th class="text-right">Contract Value</th><th class="text-right">Total Budget</th><th class="text-right">Cost to Date</th><th class="text-right">% Complete</th><th class="text-right">Earned Revenue</th><th class="text-right">Billed to Date</th><th class="text-right">Over / (Under)</th></tr></thead><tbody>
    ${(projects||[]).map(p => {
      const pBud = (budgets||[]).filter(b=>b.project_id===p.id).reduce((s,b)=>s+parseFloat(b.budgeted_amount||0),0);
      const pCost = (purchases||[]).filter(pu=>pu.project_id===p.id).reduce((s,pu)=>s+parseFloat(pu.po_amount||0),0) + (labor||[]).filter(l=>l.project_id===p.id).reduce((s,l)=>s+laborCost(l),0);
      const pBilled = (invoices||[]).filter(i=>i.project_id===p.id).reduce((s,i)=>s+parseFloat(i.billed_amount||0),0);
      const contract = parseFloat(p.base_contract||0)+parseFloat(p.approved_cos||0);
      const pctComplete = pBud>0?pCost/pBud:0;
      const earnedRev = contract*pctComplete;
      const overUnder = pBilled-earnedRev;
      return `<tr>
        <td class="font-600">${p.job_number} — ${p.job_name}</td>
        <td class="text-right">${fmt(contract)}</td>
        <td class="text-right">${fmt(pBud)}</td>
        <td class="text-right">${fmt(pCost)}</td>
        <td class="text-right">${Math.round(pctComplete*100)}%</td>
        <td class="text-right">${fmt(earnedRev)}</td>
        <td class="text-right">${fmt(pBilled)}</td>
        <td class="text-right font-600 ${overUnder>=0?'text-green':'text-red'}">${overUnder>=0?'+':''}${fmt(overUnder)}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div>
  </div>`;
}

// ── AR AGING ─────────────────────────────────────────────────────────
async function renderARaging() {
  const [{ data: invoices }, { data: projects }] = await Promise.all([
    db.from('invoices').select('*'),
    db.from('projects').select('*'),
  ]);
  const projMap = {};
  (projects||[]).forEach(p=>projMap[p.id]=p);
  const now = new Date();
  const buckets = {current:0,days30:0,days60:0,days90:0};
  const rows = (invoices||[]).filter(i=>i.status!=='Paid').map(i => {
    const ret = parseFloat(i.billed_amount||0)*(parseFloat(i.retainage_pct||0)/100);
    const outstanding = parseFloat(i.billed_amount||0)-ret-parseFloat(i.paid_amount||0);
    const invDate = i.invoice_date ? new Date(i.invoice_date) : now;
    const dueDate = new Date(invDate.getTime()+(i.terms_days||30)*86400000);
    const daysLate = Math.ceil((now-dueDate)/86400000);
    if (daysLate<=0) buckets.current+=outstanding;
    else if (daysLate<=30) buckets.days30+=outstanding;
    else if (daysLate<=60) buckets.days60+=outstanding;
    else buckets.days90+=outstanding;
    return {i,outstanding,daysLate,proj:projMap[i.project_id]};
  });
  const total = Object.values(buckets).reduce((s,v)=>s+v,0);
  $('content').innerHTML = `
  <div class="kgrid">
    <div class="kcard grn"><div class="klbl">Current</div><div class="kval">${fmt(buckets.current)}</div></div>
    <div class="kcard amb"><div class="klbl">1–30 Days Late</div><div class="kval">${fmt(buckets.days30)}</div></div>
    <div class="kcard red"><div class="klbl">31–60 Days Late</div><div class="kval">${fmt(buckets.days60)}</div></div>
    <div class="kcard red"><div class="klbl">60+ Days Late</div><div class="kval">${fmt(buckets.days90)}</div></div>
  </div>
  <div class="card">
    <div class="card-hd"><div class="card-title"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>AR Aging Detail</div></div>
    ${rows.length===0?'<div class="tbl-empty">No outstanding invoices.</div>':
    `<div class="tbl-wrap"><table><thead><tr><th>Job</th><th>Invoice #</th><th>Description</th><th class="text-right">Outstanding</th><th>Days Late</th><th>Status</th></tr></thead><tbody>
    ${rows.map(({i,outstanding,daysLate,proj})=>`<tr>
      <td class="font-600">${proj?proj.job_number+' — '+proj.job_name:'—'}</td>
      <td class="mono">${i.invoice_number||'—'}</td>
      <td>${i.description||'—'}</td>
      <td class="text-right font-600">${fmt(outstanding)}</td>
      <td class="${daysLate<=0?'text-green':daysLate<=30?'text-amber':'text-red'} font-600">${daysLate<=0?'Current':daysLate+'d late'}</td>
      <td><span class="badge b-${(i.status||'pending').toLowerCase()}">${i.status}</span></td>
    </tr>`).join('')}
    </tbody></table></div>`}
  </div>`;
}

// ── EMPLOYEES ────────────────────────────────────────────────────────

  const { data: employees } = await db.from('employees').select('*').order('name');
  state.employees = employees || [];
  $('content').innerHTML = `
  <div class="card">
    <div class="card-hd"><div class="card-title"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Employee Roster & Rates</div>
      <button class="btn btn-sm btn-red" onclick="openModal('modal-employee')">+ Add Employee</button>

}

async function saveEmployee() {
  const name = $('em-name').value.trim();
  if (!name) { toast('Enter employee name','error'); return; }
  const { error } = await db.from('employees').insert({ name, role: $('em-role').value, st_rate: parseFloat($('em-rate').value)||0, effective_date: $('em-date').value||null, active: true });
  if (error) { toast('Error: '+error.message,'error'); return; }
  closeModal('modal-employee');
  toast('Employee added');
  render();
}

// ── PROJECT CRUD ─────────────────────────────────────────────────────
async function saveProject() {
  const num = $('p-num').value.trim();
  const name = $('p-name').value.trim();
  if (!num || !name) { toast('Job number and name required','error'); return; }
  const data = { job_number:num, job_name:name, client:$('p-client').value, status:$('p-status').value, date_started:$('p-date').value||null, base_contract:parseFloat($('p-contract').value)||0 };
  const editId = $('modal-project').dataset.editId;
  let error;
  if (editId) {
    ({error} = await db.from('projects').update(data).eq('id',editId));
  } else {
    ({error} = await db.from('projects').insert(data));
  }
  if (error) { toast('Error: '+error.message,'error'); return; }
  delete $('modal-project').dataset.editId;
  closeModal('modal-project');
  toast('Project saved');
  const { data: projects } = await db.from('projects').select('*').order('created_at');
  state.projects = projects || [];
  if (!editId && state.projects.length) {
    state.activeProject = state.projects[state.projects.length-1];
    navigate('project', state.activeProject.id, 'setup');
  } else {
    renderSidebarProjects();
    if (state.activeProject) {
      state.activeProject = state.projects.find(p=>p.id===state.activeProject.id);
    }
    render();
  }
}

function editProject(id) {
  const p = state.projects.find(p=>p.id===id);
  if (!p) return;
  $('p-num').value = p.job_number;
  $('p-name').value = p.job_name;
  $('p-client').value = p.client||'';
  $('p-status').value = p.status||'Active';
  $('p-date').value = p.date_started||'';
  $('p-contract').value = p.base_contract||0;
  $('modal-project-title').textContent = 'Edit Project';
  $('modal-project').dataset.editId = id;
  openModal('modal-project');
}

function clearForm(ids) { ids.forEach(id => { const el=$(id); if(el) el.value=''; }); }

// close modals on bg click
document.querySelectorAll('.modal-bg').forEach(bg => {
  bg.addEventListener('click', e => { if(e.target===bg) bg.classList.remove('open'); });
});

// ── INIT ─────────────────────────────────────────────────────────────
async function init() {
  const { data: projects } = await db.from('projects').select('*').order('created_at');
  state.projects = projects || [];
  const { data: employees } = await db.from('employees').select('*').order('name');
  state.employees = employees || [];
  renderSidebarProjects();
  await renderDashboard();
}

init();
</script>
